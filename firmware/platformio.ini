; PlatformIO Project Configuration File
; ESP32 IoT Gateway for Road Hazard Detection Robot
;
; Uplinks:
; - Primary: MQTT over Wi-Fi
; - Secondary: HTTP REST Fallback
; Hardware UART Serial connection with Raspberry Pi 4 Edge Computer

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D MQTT_MAX_PACKET_SIZE=2048
